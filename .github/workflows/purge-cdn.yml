name: Purge jsDelivr CDN cache

on:
  push:
    branches: [main]
    paths:
      - "tp-styles.css"
      - "tp-calculator.js"
      - "logos/**"

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge tp-styles.css
        run: |
          curl -s "https://purge.jsdelivr.net/gh/guqc-tchble/teachable.pages@main/tp-styles.css"
          echo "Purged tp-styles.css"

      - name: Purge tp-calculator.js
        run: |
          curl -s "https://purge.jsdelivr.net/gh/guqc-tchble/teachable.pages@main/tp-calculator.js"
          echo "Purged tp-calculator.js"

      - name: Purge logos
        run: |
          for logo in affirm afterpay alipay amex apple-pay bancontact blik google-pay grabpay klarna mastercard mobilepay multibanco pix przelewy24 revolut-pay sepa twint visa wechat-pay; do
            curl -s "https://purge.jsdelivr.net/gh/guqc-tchble/teachable.pages@main/logos/${logo}.svg"
          done
          echo "Purged 20 logos"
